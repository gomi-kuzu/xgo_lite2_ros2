xgo_lite2_driver:
  ros__parameters:
    serial_port: /dev/ttyAMA0
    baudrate: 115200

    # cmd_vel scaling: input assumed [m/s] / [rad/s], scaled to xgolib step units.
    # xgolib turn() step is in deg/s -> 1 rad/s ~= 57.3 deg/s.
    # linear step is not strict m/s; gains map 1 m/s -> full-scale hardware limit.
    linear_gain_x: 25.0
    linear_gain_y: 18.0
    angular_gain: 57.3
    cmd_vel_timeout: 0.5

    # 12 leg servos exposed as /joint_states and /joint_cmds.
    # Ordering matches read_motor() indices [11,12,13,21,22,23,31,32,33,41,42,43].
    # Leg mapping per Elecfreaks doc: 1=LF, 2=RF, 3=RR, 4=LR.
    # The claw (id 51) and arm servos (52, 53) are exposed via /claw_cmd
    # and /arm_cmd respectively, not through joint_states.
    joint_names:
      - lf_lower
      - lf_middle
      - lf_upper
      - rf_lower
      - rf_middle
      - rf_upper
      - rr_lower
      - rr_middle
      - rr_upper
      - lr_lower
      - lr_middle
      - lr_upper
    motor_ids: [11, 12, 13, 21, 22, 23, 31, 32, 33, 41, 42, 43]

    joint_state_rate_hz: 20.0
    imu_rate_hz: 20.0
    battery_rate_hz: 1.0
    odom_rate_hz: 20.0

    base_frame_id: base_link
    odom_frame_id: odom
    imu_frame_id: imu_link
    publish_odom_tf: false

    default_preset_duration: 3.0
    preset_feedback_rate_hz: 5.0
